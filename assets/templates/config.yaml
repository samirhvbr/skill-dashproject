analysis:
  provider: anthropic
  # Tem de ser o MESMO string do frontmatter de SKILL.md — check-docs.sh reprova
  # divergencia (ADR-0011 §2).
  model: sonnet
  effort: medium
  debounce_minutes: 10
  default_level: incremental
  # Escalonamento por ESFORCO, nao por modelo (ADR-0012). Um modelo so; o que
  # muda e o orcamento de raciocinio. Valores: low | medium | high | xhigh | max
  # — nunca nome de modelo. Escalonar NAO e automatico: o auditor para e pede a
  # troca ao operador (ADR-0011 §3).
  escalate:
    bootstrap: xhigh
    deep: high
    release: high
    low_confidence: high
    major_divergence: high
  # O review commita o proprio snapshot (`chore(dashproject)`, que o hook ignora) e
  # devolve a arvore limpa. `false` = snapshot fica sujo de proposito, para revisao
  # humana antes de entrar na historia.
  auto_commit: true
  poll_seconds: 30

review_notify: ""

activity:
  enabled: true
  loc: false
  weeks: 8

precision_weights:
  clarity: 25
  granularity: 20
  traceability: 35
  documentation: 20

ignore_commit_subjects:
  - "chore(dashproject)"
