analysis:
  provider: anthropic
  model: sonnet
  debounce_minutes: 10
  default_level: incremental
  escalate:
    bootstrap: opus
    low_confidence: opus
    release: opus
    major_divergence: opus
  auto_commit: false
  poll_seconds: 30

review_notify: ""

activity:
  enabled: true
  loc: false
  weeks: 8

precision_weights:
  clarity: 25
  granularity: 20
  traceability: 35
  documentation: 20

ignore_commit_subjects:
  - "chore(dashproject)"
